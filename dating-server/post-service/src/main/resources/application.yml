server:
  port: ${POST_SERVICE_PORT:18084}

spring:
  application:
    name: dating-post-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "optional:nacos:dating-post-service-dev.yaml"
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-init-sql: SET TIME ZONE 'UTC'
  data:
    redis:
      timeout: 3s
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:38.76.188.242:8848}
        namespace: ${NACOS_NAMESPACE:putao-dating-dev}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
      config:
        enabled: true
        import-check:
          enabled: true
        server-addr: ${NACOS_SERVER_ADDR:38.76.188.242:8848}
        namespace: ${NACOS_NAMESPACE:putao-dating-dev}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        file-extension: yaml
        group: DEFAULT_GROUP
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_history_post

# gRPC Server Configuration
grpc:
  server:
    port: ${POST_SERVICE_GRPC_PORT:19084}

# user-service gRPC Client Configuration
user:
  service:
    grpc:
      host: ${USER_SERVICE_HOST:localhost}
      port: ${USER_SERVICE_GRPC_PORT:19090}

# Snowflake ID Configuration
snowflake:
  worker-id: ${SNOWFLAKE_WORKER_ID:1}
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}

# Redis Key Prefix
app:
  cache:
    key-prefix: putao

# RocketMQ Configuration
rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:38.76.188.242:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:youjianxin_dating_dev_post_producer}
    send-message-timeout: 3000

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# MyBatis Plus Configuration
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.dating.post.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Logging Configuration
logging:
  level:
    root: INFO
    com.dating.post: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
