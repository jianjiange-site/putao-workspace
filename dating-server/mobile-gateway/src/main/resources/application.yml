server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: dating-mobile-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "optional:nacos:dating-mobile-gateway-dev.yaml"
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:38.76.188.242:8848}
        namespace: ${NACOS_NAMESPACE:putao-dating-dev}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
      config:
        enabled: true
        import-check:
          enabled: true
        server-addr: ${NACOS_SERVER_ADDR:38.76.188.242:8848}
        namespace: ${NACOS_NAMESPACE:putao-dating-dev}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        file-extension: yaml
        group: DEFAULT_GROUP

# gRPC Configuration (if needed)
grpc:
  server:
    port: ${GATEWAY_GRPC_PORT:19080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
