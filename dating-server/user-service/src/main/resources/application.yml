server:
  port: ${USER_SERVICE_PORT:18081}
  shutdown: graceful

spring:
  application:
    name: dating-user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "optional:nacos:dating-user-service-dev.yaml"
  main:
    banner-mode: log

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-init-sql: SET TIME ZONE 'UTC'

  data:
    redis:
      timeout: 3s

  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:38.76.188.242:8848}
        namespace: ${NACOS_NAMESPACE:putao-dating-dev}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:jianjiange}
      config:
        enabled: true
        import-check:
          enabled: true
        server-addr: ${NACOS_SERVER_ADDR:38.76.188.242:8848}
        namespace: ${NACOS_NAMESPACE:putao-dating-dev}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:jianjiange}
        file-extension: yaml
        group: DEFAULT_GROUP

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    placeholder-replacement: false
    table: flyway_history_user

# gRPC Server
grpc:
  server:
    port: ${USER_SERVICE_GRPC_PORT:19081}
    enable-keep-alive: true
    keep-alive-time: 30s
    keep-alive-timeout: 10s
    permit-keep-alive-without-calls: true

# Snowflake ID Configuration
snowflake:
  worker-id: ${SNOWFLAKE_WORKER_ID:1}
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}

# Redis Key Prefix(全服务统一 putao:<service>)
app:
  cache:
    key-prefix: putao:user

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.dating.user.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Logging
logging:
  level:
    root: INFO
    com.dating.user: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [traceId=%X{traceId:-},userId=%X{userId:-}] %-5level %logger{36} - %msg%n"

# JVM timezone(强制 UTC)
jvm:
  timezone: UTC
