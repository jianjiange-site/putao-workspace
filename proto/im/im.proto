syntax = "proto3";

package com.dating.im.proto;

option java_multiple_files = true;
option java_package = "com.dating.im.proto";
option java_outer_classname = "ImProto";

import "common/result.proto";

// Send message request
message SendMessageRequest {
  int64 sender_id = 1;
  int64 receiver_id = 2;
  string content = 3;
  string message_type = 4;
}

// Send message response
message SendMessageResponse {
  string message_id = 1;
  int64 created_at = 2;
}

// Get IM token request
message GetImTokenRequest {
  int64 user_id = 1;
  string nickname = 2;
  string avatar_key = 3;
}

// Get IM token response
message GetImTokenResponse {
  string im_token = 1;
  string api_url = 2;
  string ws_url = 3;
}

// IM service definition
service ImService {
  // Send message
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  
  // Get IM token for user
  rpc GetImToken(GetImTokenRequest) returns (GetImTokenResponse);
}
